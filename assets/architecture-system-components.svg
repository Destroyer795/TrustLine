" width="8" height="120" rx="4" fill="#2F6F68"/><text x="113" y="313" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Northstar principal</text><text x="113" y="342" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Registers scope and signs the</text><text x="113" y="360" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">accountable mandate</text></g><g filter="url(#shadow)"><rect x="79" y="439" width="297" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="85" y="445" width="285" height="120" rx="22" fill="#FFFCF5" stroke="none" stroke-width="1"/><rect x="85" y="445" width="8" height="120" rx="4" fill="#6E7653"/><text x="113" y="483" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Autonomous agent</text><text x="113" y="512" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Presents credential, intent,</text><text x="113" y="530" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">and idempotency key</text></g><g filter="url(#shadow)"><rect x="434" y="269" width="302" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="440" y="275" width="290" height="120" rx="22" fill="#E6F0EF" stroke="none" stroke-width="1"/><rect x="440" y="275" width="8" height="120" rx="4" fill="#2F6F68"/><text x="468" y="313" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Signed mandate</text><text x="468" y="342" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Ed25519 binding · ceiling ·</text><text x="468" y="360" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">expiry · linked account</text></g><g filter="url(#shadow)"><rect x="434" y="439" width="302" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="440" y="445" width="290" height="120" rx="22" fill="#E6F0EF" stroke="none" stroke-width="1"/><rect x="440" y="445" width="8" height="120" rx="4" fill="#6E7653"/><text x="468" y="483" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Capability manifest</text><text x="468" y="512" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Allowed categories · transaction</text><text x="468" y="530" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">and daily caps</text></g><g filter="url(#shadow)"><rect x="804" y="244" width="327" height="157" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="810" y="250" width="315" height="145" rx="22" fill="#1E2726" stroke="none" stroke-width="1"/><rect x="810" y="250" width="8" height="145" rx="4" fill="#C86A3B"/><text x="838" y="288" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Transaction gateway</text><text x="838" y="317" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Locks rows, verifies authority,</text><text x="838" y="335" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">checks policy, reserves atomically</text></g><text x="838" y="367" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#F4F0E6" text-anchor="start">DETERMINISTIC DECISION</text><g filter="url(#shadow)"><rect x="804" y="439" width="327" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="810" y="445" width="315" height="120" rx="22" fill="#FFFCF5" stroke="none" stroke-width="1"/><rect x="810" y="445" width="8" height="120" rx="4" fill="#2F6F68"/><text x="838" y="483" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Risk + credit engine</text><text x="838" y="512" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Five visible components → target →</text><text x="838" y="530" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">asymmetric EMA limit</text></g><g filter="url(#shadow)"><rect x="804" y="609" width="327" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="810" y="615" width="315" height="120" rx="22" fill="#FFFCF5" stroke="none" stroke-width="1"/><rect x="810" y="615" width="8" height="120" rx="4" fill="#C86A3B"/><text x="838" y="653" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Repayment scheduler</text><text x="838" y="682" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Mandate pull happens outside the</text><text x="838" y="700" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">agent’s control</text></g><g filter="url(#shadow)"><rect x="1204" y="244" width="287" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="1210" y="250" width="275" height="120" rx="22" fill="#FFFCF5" stroke="none" stroke-width="1"/><rect x="1210" y="250" width="8" height="120" rx="4" fill="#2F6F68"/><text x="1238" y="288" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">PostgreSQL ledger</text><text x="1238" y="317" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Accounts · draws ·</text><text x="1238" y="335" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">reservations · outcomes</text></g><g filter="url(#shadow)"><rect x="1204" y="424" width="287" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="1210" y="430" width="275" height="120" rx="22" fill="#FFFCF5" stroke="none" stroke-width="1"/><rect x="1210" y="430" width="8" height="120" rx="4" fill="#A94442"/><text x="1238" y="468" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">Authority state machine</text><text x="1238" y="497" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">NORMAL · RESTRICTED · FROZEN ·</text><text x="1238" y="515" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">HUMAN REVIEW</text></g><g filter="url(#shadow)"><rect x="1204" y="604" width="287" height="132" rx="28" fill="rgba(30,39,38,.04)" stroke="#D8D1C3" stroke-width="1"/><rect x="1210" y="610" width="275" height="120" rx="22" fill="#1E2726" stroke="none" stroke-width="1"/><rect x="1210" y="610" width="8" height="120" rx="4" fill="#2F6F68"/><text x="1238" y="648" font-family="Geist Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#1E2726" text-anchor="start">SHA-256 audit chain</text><text x="1238" y="677" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">Every state and money event</text><text x="1238" y="695" font-family="Geist Sans, Arial, sans-serif" font-size="13" font-weight="450" fill="#5F6966" text-anchor="start">links to prior evidence</text></g><path d="M370 335 L440 335" fill="