version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustline_postgres
    environment:
      POSTGRES_DB: trustline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trustline_backend
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py collectstatic --noinput &&
             python scripts/seed_demo.py &&
             gunicorn backend.config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DB_NAME=trustline
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=postgres
      - DB_PORT=5432
      - SECRET_KEY=trustline-docker-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: trustline_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
