databases:
  - name: trustline-db
    databaseName: trustline
    user: trustline
    plan: free

services:
  - type: web
    name: trustline-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    dockerCommand: sh -c "python backend/manage.py migrate && python backend/manage.py collectstatic --noinput && gunicorn backend.config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustline-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: trustline-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
